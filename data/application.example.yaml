en:
  company: "Example Robotics A/S"
  recipient: "Anna Andersen"
  subject: "Application: Software Developer, robot vision"
  closing: "I hope to hear from you,"
  body: |
    Dear Anna,

    I read your posting for a software developer in robot vision, and your work on automated inspection is exactly the kind of problem I enjoy.

    For the last three years I have developed vision software for industrial quality control:

    - **Vision in production.** At Nordlys Automation I developed a camera-based check of welded steel parts, from prototype to running at the customer.
    - **Robots.** As a research assistant I built a point-cloud pipeline that let a robot grasp unknown objects.
    - **Quality.** I set up automated tests and a CI pipeline, so new versions could be released faster and more safely.

    I would be glad to tell you more in an interview.
