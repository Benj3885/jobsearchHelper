# Example CV content (made up). Same structure as data/cv.yaml.
# Used with data/personal.example.yaml by make_examples.py, so the example PDFs in templates/
# contain no real information. Companies, projects and the paper are fictional.

tracks:
  robotics_vision:
    headline: Robotics & Computer Vision Software Engineer
    cv_title: CV - Robotics Engineer with Software Experience
    skills_order: [languages, robotics, vision, tools, ways]
    projects_first: true
  software:
    headline: Software Developer (C#, Python, C++)
    cv_title: CV - Software Developer (C#, Python, C++)
    skills_order: [languages, tools, vision, robotics, ways]
    projects_first: false
    languages_override: "C#, Python, C++, Rust"

profile: >-
  Engineer with a background in robotics and image analysis. I build software
  for machines that see and move: calibration tools, inspection systems and
  robot control. I like turning prototypes into tested, documented software
  that other people can maintain.

skills:
