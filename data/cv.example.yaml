    label: Languages
    text: "Python, C++, C#, Rust"
  robotics:
    label: Robotics
    text: "ROS 2, motion planning, collaborative robots, hand-eye calibration"
  vision:
    label: Computer vision & AI
    text: "OpenCV, PyTorch, point clouds, dataset labelling and model evaluation"
  tools:
    label: Tools
    text: "Git, Docker, CI pipelines, Linux"
  ways:
    label: Ways of working
    text: "Agile teams, code review, writing clear documentation"

experience:
  - title: Vision Software Developer
    org: Nordlys Automation ApS, Exampleby
    period: 2022 – 2025
    bullets:
      - Developed a camera-based quality check for welded steel parts.
      - Wrote calibration tools used by field technicians at customer sites.
      - Set up automated tests and a CI pipeline for the vision software.
  - title: Research Assistant, 3D perception
    org: Example University
    period: 2020 – 2022
    bullets:
      - Built a point-cloud pipeline for grasping unknown objects.
      - Supervised student projects on robot vision.
  - title: Student Developer
    org: Fjordbyen Logistics A/S
    period: 2018 – 2020
    bullets:
      - Maintained internal tools for warehouse scanning in C#.
      - Wrote scripts that cut manual reporting time by half.

projects:
